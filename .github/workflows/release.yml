name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pillow
      - run: pyinstaller --onefile --console --icon=FapForge.ico --name FapForge fap_builder.py
      - uses: actions/upload-artifact@v4
        with:
          name: FapForge-windows
          path: dist/FapForge.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pillow
      - run: pyinstaller --onefile --console --name FapForge-linux fap_builder.py
      - run: chmod +x dist/FapForge-linux
      - uses: actions/upload-artifact@v4
        with:
          name: FapForge-linux
          path: dist/FapForge-linux

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pillow
      - run: pyinstaller --onefile --console --name FapForge-macos fap_builder.py
      - run: chmod +x dist/FapForge-macos
      - uses: actions/upload-artifact@v4
        with:
          name: FapForge-macos
          path: dist/FapForge-macos

  build-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source distribution .tgz
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/FapForge-$VERSION
          cp fap_builder.py fap_builder.sh FapForge.ico LICENSE README.md dist/FapForge-$VERSION/
          chmod +x dist/FapForge-$VERSION/fap_builder.sh
          cd dist
          tar czf "FapForge-$VERSION-source.tgz" "FapForge-$VERSION/"
      - uses: actions/upload-artifact@v4
        with:
          name: FapForge-source
          path: dist/FapForge-*-source.tgz

  release:
    needs: [build-windows, build-linux, build-macos, build-source]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FapForge-*
          merge-multiple: true
          path: release-assets
      - name: Prepare release assets
        working-directory: release-assets
        run: |
          ls -la
          if [ -f FapForge.exe ]; then mv FapForge.exe FapForge-windows-x86_64.exe; fi
          if [ -f FapForge-linux ]; then mv FapForge-linux FapForge-linux-x86_64 && chmod +x FapForge-linux-x86_64; fi
          if [ -f FapForge-macos ]; then mv FapForge-macos FapForge-macos-x86_64 && chmod +x FapForge-macos-x86_64; fi
          ls -la
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
