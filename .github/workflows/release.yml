name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pillow
      - run: pyinstaller --onefile --console --icon=FapForge.ico --name FapForge fap_builder.py
      - uses: actions/upload-artifact@v4
        with:
          name: FapForge-windows
          path: dist/FapForge.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pillow
      - run: pyinstaller --onefile --console --name FapForge-linux fap_builder.py
      - uses: actions/upload-artifact@v4
        with:
          name: FapForge-linux
          path: dist/FapForge-linux

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pillow
      - run: pyinstaller --onefile --console --name FapForge-macos fap_builder.py
      - uses: actions/upload-artifact@v4
        with:
          name: FapForge-macos
          path: dist/FapForge-macos

  release:
    needs: [build-windows, build-linux, build-macos]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FapForge-*
          merge-multiple: true
      - name: Rename and prepare release assets
        run: |
          if [ -f FapForge.exe ]; then mv FapForge.exe FapForge-windows-x86_64.exe; fi
          if [ -f FapForge-linux ]; then mv FapForge-linux FapForge-linux-x86_64 && chmod +x FapForge-linux-x86_64; fi
          if [ -f FapForge-macos ]; then mv FapForge-macos FapForge-macos-x86_64 && chmod +x FapForge-macos-x86_64; fi
      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=""
          for f in FapForge-windows-x86_64.exe FapForge-linux-x86_64 FapForge-macos-x86_64; do
            [ -f "$f" ] && assets="$assets $f"
          done
          if [ -n "$assets" ]; then
            # shellcheck disable=SC2086
            gh release create v1.0.0 $assets --title "v1.0.0" --notes "See the commits for details."
          else
            echo "No assets found, creating empty release"
            gh release create v1.0.0 --title "v1.0.0" --notes "No binaries were built."
          fi
